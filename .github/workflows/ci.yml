name: CI

on:
  push:
    branches:
      - main
   
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Download the code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Build package
        run: |
          mkdir build
          zip -r build/calculator-app.zip app.py calculator.py requirements.txt templates

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-app
          path: build/calculator-app.zip